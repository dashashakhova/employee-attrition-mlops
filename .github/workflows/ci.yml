name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile api/app.py
          python -m py_compile api/model_loader.py
          python -m py_compile training/baseline_model.py
          python -m py_compile training/train.py
          python -m py_compile features/feature_store.py

      - name: Build Docker image
        run: docker build -f docker/api/Dockerfile -t employee-attrition-api .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deployment hook
        run: echo "Configure RENDER_DEPLOY_HOOK secret to trigger the production deployment"
