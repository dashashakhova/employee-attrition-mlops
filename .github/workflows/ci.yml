name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        env:
          ALLOW_STATIC_FALLBACK: "true"
        run: python -m pytest -q
      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t employee-attrition-api .

      - name: Run API smoke test
        run: |
          set -e
          docker run -d --name employee-attrition-api-test -p 8000:8000 employee-attrition-api
          trap 'docker rm -f employee-attrition-api-test >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              curl --fail --silent                 -X POST                 -H "Content-Type: application/json"                 -d '{"Age":35,"MonthlyIncome":5000,"OverTime":"Yes"}'                 http://127.0.0.1:8000/predict
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs employee-attrition-api-test
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"